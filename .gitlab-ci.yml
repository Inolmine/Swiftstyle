stages:
  - security
  - validation
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - when: never

.node:
  image: node:22
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

secret_detection:
  stage: security
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks dir --redact .
    - gitleaks git --redact .
  allow_failure: false

sast_frontend:
  stage: security
  image: semgrep/semgrep
  script:
    - semgrep scan --config auto --error src/ integrations/ next.config.ts open-next.config.ts
  allow_failure: false

sast_backend:
  stage: security
  image: semgrep/semgrep
  script:
    - semgrep scan --config auto --error backend/app/ backend/scripts/
  allow_failure: false

validation_projet:
  extends: .node
  stage: validation
  script:
    - npm run typecheck
    - npm test
    - npx opennextjs-cloudflare build
  allow_failure: false

validation_backend:
  stage: validation
  image: python:3.14-slim
  script:
    - cd backend
    - pip install --no-cache-dir -r requirements-dev.txt
    - pytest -q
  allow_failure: false

deploy_cloudflare:
  extends: .node
  stage: deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CLOUDFLARE_API_TOKEN'
  environment:
    name: production
    url: https://swiftstyle.fr
  script:
    - npx opennextjs-cloudflare build
    - npx opennextjs-cloudflare deploy
  allow_failure: false
