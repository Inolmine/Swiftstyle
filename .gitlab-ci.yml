# CI du projet de l'API photo, une fois sorti du dépôt du site : secrets, analyse du code, tests, image Docker.
stages:
  - security
  - validation

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - when: never

secret_detection:
  stage: security
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks dir --redact .
    - gitleaks git --redact .

sast:
  stage: security
  image: semgrep/semgrep
  script:
    - semgrep scan --config auto --error app/ scripts/

tests:
  stage: validation
  image: python:3.14-slim
  script:
    - pip install --no-cache-dir -r requirements-dev.txt
    - pytest -q

docker_build:
  stage: validation
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t swiftstyle-api .
    - docker run --rm swiftstyle-api python -c "import mediapipe, app.main; print(app.main.MODEL_PATH.is_file())"
